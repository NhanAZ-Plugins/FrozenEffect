name: Test FrozenEffect virion and consumer build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate virion API and packaging
    runs-on: ubuntu-24.04
    steps:
      - name: Check out FrozenEffect source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out pinned Axolotl-PM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955
          path: .dependencies/axolotl-pm
          persist-credentials: false

      - name: Set up Axolotl-PM PHP environment
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
        with:
          php-version: "8.1"
          pm-version-major: "5"
          install-path: ./.php-bin

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked PHPStan and Axolotl-PM dependencies
        shell: bash
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          composer install --working-dir=.dependencies/axolotl-pm --no-dev --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins

      - name: Validate virion manifest and PHP syntax
        shell: bash
        run: |
          php -r '$m=yaml_parse_file("virion.yml"); if(!is_array($m) || ($m["name"] ?? null) !== "FrozenEffect" || ($m["api"] ?? null) !== "5.0.0" || ($m["version"] ?? null) !== "2.0.0") exit(1);'
          find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPStan at maximum level
        run: php vendor/phpstan/phpstan/phpstan.phar analyse --level=max --autoload-file=.dependencies/axolotl-pm/vendor/autoload.php --no-progress src tests/frozen-packet.php tests/consumer/src

      - name: Test frozen effect packet fields
        run: php tests/frozen-packet.php .dependencies/axolotl-pm

      - name: Stage FrozenEffect for the consumer fixture
        shell: bash
        run: |
          mkdir -p tests/consumer/virions/FrozenEffect
          cp virion.yml LICENSE tests/consumer/virions/FrozenEffect/
          cp -R src tests/consumer/virions/FrozenEffect/

      - name: Build consumer PHAR with pinned DevTools
        id: build
        uses: NhanAZ/DevTools@8d13a75aaf4f330fdbd93737d58be9cacc41e262
        with:
          project: tests/consumer
          virions: tests/consumer/virions
          output: tests/consumer/build

      - name: Verify consumer PHAR contents and checksum
        shell: bash
        env:
          PHAR_PATH: ${{ steps.build.outputs.phar }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          php -r '$p=new Phar(getenv("PHAR_PATH")); $found=false; foreach(new RecursiveIteratorIterator($p) as $file){if(str_ends_with($file->getPathname(),"/FrozenEffect.php")) $found=true;} $m=json_decode(file_get_contents(getenv("BUILD_METADATA")),true,512,JSON_THROW_ON_ERROR); if(!$found || !$p->offsetExists("META-INF/virions/FrozenEffect/LICENSE") || hash_file("sha256",getenv("PHAR_PATH")) !== $m["data"]["sha256"]) exit(1);'

      - name: Upload verified consumer fixture artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: FrozenEffect-consumer-${{ github.sha }}
          path: ${{ steps.build.outputs.phar }}
          if-no-files-found: error
          retention-days: 14
